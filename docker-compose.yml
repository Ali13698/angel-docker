version: '3.8'

services:
  postgres:
    image: postgres:18.1
    container_name: angel-postgres
    environment:
      POSTGRES_USER: postgres
      # رمز از متغیر محیطی خوانده می‌شود که در پنل رانفلر تعریف می‌کنیم
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: angel-dbhsl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - angel-network

  redis:
    image: redis:8.4
    container_name: angel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - angel-network

volumes:
  postgres_data:
  redis_data:

networks:
  angel-network:
    driver: bridge
